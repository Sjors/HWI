name: Test dist
description: Run dist tests for one device type.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pip install poetry

    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Install (Wheel)
      if: matrix.test.script == 'Wheel'
      shell: bash
      run: |
        pip install dist/*.whl

    - name: Install (Sdist)
      if: matrix.test.script == 'Sdist'
      shell: bash
      run: |
        pip install $(find dist -name "*.tar.gz" -a -not -name "*linux*")

    - name: Install (Bindist)
      if: matrix.test.script == 'Bindist'
      shell: bash
      run: |
        poetry install; cd dist; tar -xvf hwi*linux*.tar.gz; cd ..

    - uses: actions/download-artifact@v8
      with:
        name: bitcoind

    - shell: bash
      run: |
        tar -xvf bitcoind.tar.gz

    - uses: ./.github/actions/install-sim
      with:
        device: ${{ matrix.device }}

    - name: Run tests (Wheel)
      if: matrix.test.script == 'Wheel'
      shell: bash
      run: |
        cd test; ./run_tests.py --${{ matrix.device }} --interface=cli --device-only; cd ..

    - name: Run tests (Sdist)
      if: matrix.test.script == 'Sdist'
      shell: bash
      run: |
        cd test; ./run_tests.py --${{ matrix.device }} --interface=cli --device-only; cd ..

    - name: Run tests (Bindist)
      if: matrix.test.script == 'Bindist'
      shell: bash
      run: |
        cd test; poetry run ./run_tests.py --${{ matrix.device }} --interface=bindist --device-only; cd ..

    # TEMPORARY ANTI-EXFIL: execute against the companion firmware/Core forks.
    - name: Test interactive anti-exfil
      shell: bash
      run: |
        case "${{ matrix.device }}" in
          ledger) anti_exfil_flags=(--ledger-anti-exfil-core) ;;
          trezor-1|trezor-t|coldcard-edge|jade|bitbox02) anti_exfil_flags=(--anti-exfil) ;;
          *) exit 0 ;;
        esac
        interface=cli
        runner=(./run_tests.py)
        if [[ "${{ matrix.test.script }}" == Bindist ]]; then
          interface=bindist
          runner=(poetry run ./run_tests.py)
        fi
        cd test
        "${runner[@]}" --${{ matrix.device }} --device-only --interface=${interface} "${anti_exfil_flags[@]}"

    - if: failure()
      shell: bash
      run: |
        tail -v -n +1 test/*.std*

