name: Test device
description: Run tests for one device type.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pip install poetry
        poetry install

    - uses: actions/download-artifact@v8
      with:
        name: bitcoind

    - shell: bash
      run: |
        tar -xvf bitcoind.tar.gz

    - uses: ./.github/actions/install-sim
      with:
        device: ${{ matrix.device }}

    - name: Run tests
      shell: bash
      run: |
        cd test; poetry run ./run_tests.py --${{ matrix.device }} --interface=${{ matrix.test.interface }} --device-only; cd ..

    # TEMPORARY ANTI-EXFIL: execute against the companion firmware/Core forks.
    - name: Test interactive anti-exfil
      shell: bash
      run: |
        case "${{ matrix.device }}" in
          ledger) anti_exfil_flags=(--ledger-anti-exfil-core) ;;
          trezor-1|trezor-t|coldcard-edge|jade|bitbox02) anti_exfil_flags=(--anti-exfil) ;;
          *) exit 0 ;;
        esac
        cd test
        poetry run ./run_tests.py --${{ matrix.device }} --device-only --interface=${{ matrix.test.interface }} "${anti_exfil_flags[@]}"

    - if: failure()
      shell: bash
      run: |
        tail -v -n +1 test/*.std*
