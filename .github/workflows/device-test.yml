name: Device Test Template
on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      python_versions:
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'

jobs:
  test-device:
    name: Python ${{ matrix.python-version }} ${{ matrix.device }} ${{ matrix.test.core_ipc && format('Core IPC ({0})', matrix.test.core_ipc) || matrix.test.script || matrix.test.interface }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
        device:
          - ${{ inputs.device }}
        test:
          - {interface: 'library'}
          - {interface: 'cli'}
          - {interface: 'stdin'}
          - {script: 'Wheel'}
          - {script: 'Sdist'}
          - {script: 'Bindist'}
        # The Bitcoin Core IPC signer test gets one dedicated job per device,
        # on the newest Python and against the wheel.
        include:
          - python-version: '3.14'
            device: ${{ inputs.device }}
            test: {core_ipc: 'Wheel'}
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: run test
        if: ${{ matrix.test.interface }}
        uses: ./.github/actions/test-device
      - name: run dist test
        if: ${{ matrix.test.script }}
        uses: ./.github/actions/test-dist
      - name: run Core IPC test
        if: ${{ matrix.test.core_ipc }}
        uses: ./.github/actions/test-core-ipc
