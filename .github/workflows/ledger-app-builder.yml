name: Ledger Nano X App Builder
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  build:
    name: Build Bitcoin App
    runs-on: ${{ inputs.runs-on }}
    # app-bitcoin develop (2.5.1) is validated with SDK v26.5.0 in builder 5.3.17.
    container: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:5.3.17
    steps:
      - run: |
          # TEMPORARY ANTI-EXFIL: companion fork branch; restore upstream develop after integration.
          git clone --branch 2026/10/taproot-anti-exfil https://github.com/Sjors/ledger-bitcoin-app.git app-bitcoin
          cd app-bitcoin
          make DEBUG=1 COIN=bitcoin_testnet BOLOS_SDK=$NANOX_SDK
      - uses: actions/upload-artifact@v7
        with:
          name: ledger_app
          path: app-bitcoin/bin/app.elf
